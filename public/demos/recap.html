      ph.style.transform=`scale(${1+(vs-1)*.5})`;
    } else {
      rail.style.transform=`translate(${(W/2-sx)*k}px,${(H/2-sy)*k}px) scale(${rs})`;
      ph.style.transform=`scale(${vs})`;
    } };
  const floatHeart=(red=true)=>{ const f=document.createElement('div'); f.className='fh'; f.style.color=red?'var(--tally)':'#fff';
    f.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 4.5 6.8 4.5c2.2 0 3.6 1.2 5.2 3 1.6-1.8 3-3 5.2-3 3.8 0 5.9 4 4.4 7.3C19.5 16.4 12 21 12 21z" fill="currentColor"/></svg>';
    f.style.left=(hx+R(-14,4))+'px'; f.style.top=(hy-8)+'px'; f.style.setProperty('--fx',R(-50,20).toFixed(0)+'px'); f.style.setProperty('--fr',R(-35,35).toFixed(0)+'deg');
    rail.appendChild(f); setTimeout(()=>f.remove(),1000); };
  tAt(T+1680,()=>{ const r=hrt.querySelector('svg').getBoundingClientRect(), rr=rail.getBoundingClientRect(), cr=rail.parentElement.getBoundingClientRect();
    W=cr.width; H=cr.height; sx=r.left-cr.left+r.width/2; sy=r.top-cr.top+r.height/2; hx=r.left-rr.left+r.width/2; hy=r.top-rr.top+r.height/2; });
  tAt(T+1780,()=>{
    camTo(1.8,1.12,.55,'cubic-bezier(.2,1.25,.4,1)');
    const t0=performance.now(), spans=[...rail.querySelectorAll('span[data-to]')];
    const step=now=>{ const p=Math.min(1,(now-t0)/1700), e=p<1?Math.pow(p,2.3):1;
      spans.forEach(sp=>{ sp.textContent=fv(Math.max(1,+sp.dataset.to*e)); });
      if(p<1&&tPlaying) requestAnimationFrame(step); };
    requestAnimationFrame(step);
    [...rail.querySelectorAll('.act')].forEach((a,k)=>{ for(let j=0;j<6;j++) tAt(T+1780+k*80+j*280,()=>{ a.classList.add('bump'); setTimeout(()=>a.classList.remove('bump'),130); }); });
    for(let j=0;j<10;j++) tAt(T+2030+j*150,()=>floatHeart(j%3!==0));
  });
  tAt(T+2380,()=>camTo(2.2,1.25,1.25,'cubic-bezier(.5,0,.2,1)'));
  tAt(T+3680,()=>{ const t=document.createElement('div'); t.className='touch tap'; t.style.left=hx+'px'; t.style.top=hy+'px'; t.style.width=t.style.height='34px'; t.style.margin='-17px 0 0 -17px'; rail.appendChild(t); setTimeout(()=>t.remove(),500); });
  tAt(T+3810,()=>{
    hrt.classList.remove('liked'); void hrt.offsetWidth; hrt.classList.add('liked');
    const b=document.createElement('div'); b.className='burst'; b.style.left=hx+'px'; b.style.top=hy+'px';
    b.innerHTML='<span class="ring"></span>'+Array.from({length:8},(_,k)=>`<i style="--a:${k*45}deg"></i>`).join(''); rail.appendChild(b); void b.offsetWidth; b.classList.add('go');
    camTo(2.38,1.3,.12,'ease-out'); tAt(T+3930,()=>camTo(2.2,1.25,.35,'cubic-bezier(.3,1.4,.5,1)'));
    for(let j=0;j<6;j++) tAt(T+3830+j*70,()=>floatHeart(true));
  });
}
/* barras de cor com falha de sinal: ligar o CRT, sinal a vacilar e colapso digital */
let bgRaf=null;
function barsGlitch(dur){
  cancelAnimationFrame(bgRaf);
  const cv=document.getElementById('t1c'), ctx=cv.getContext('2d');
  const w=cv.width=Math.min(720,Math.round(innerWidth*.75)), h=cv.height=Math.round(w*innerHeight/innerWidth);
  // barras SMPTE desenhadas uma vez
  const base=document.createElement('canvas'); base.width=w; base.height=h; const b=base.getContext('2d');
  const top=['#C0C0C0','#C0C000','#00C0C0','#00C000','#C000C0','#C00000','#0000C0'], mid=['#0000C0','#131313','#C000C0','#131313','#00C0C0','#131313','#C0C0C0'];
  const bw=w/7, h1=Math.round(h*.67), h2=Math.round(h*.08);
  top.forEach((c,i)=>{ b.fillStyle=c; b.fillRect(Math.floor(i*bw),0,Math.ceil(bw)+1,h1); });
  mid.forEach((c,i)=>{ b.fillStyle=c; b.fillRect(Math.floor(i*bw),h1,Math.ceil(bw)+1,h2); });
  const bot=[['#00214C',1.25],['#FFFFFF',1.25],['#32006A',1.25],['#131313',1.25],['#090909',.33],['#131313',.34],['#1D1D1D',.33],['#131313',1]];
  let x=0; bot.forEach(([c,u])=>{ b.fillStyle=c; b.fillRect(Math.floor(x),h1+h2,Math.ceil(u*bw)+1,h-h1-h2); x+=u*bw; });
  // canais de cor separados (para a aberração cromática)
  const src=b.getImageData(0,0,w,h).data, chans=[0,1,2].map(ci=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; const cx=c.getContext('2d'), im=cx.createImageData(w,h);
    for(let i=0;i<src.length;i+=4){ im.data[i+ci]=src[i+ci]; im.data[i+3]=255; } cx.putImageData(im,0,0); return c; });
  // grão
  const nz=document.createElement('canvas'); nz.width=nz.height=128; const nx=nz.getContext('2d'), ni=nx.createImageData(128,128);
  for(let i=0;i<ni.data.length;i+=4){ const v=Math.random()*255; ni.data[i]=ni.data[i+1]=ni.data[i+2]=v; ni.data[i+3]=255; } nx.putImageData(ni,0,0);
  const grain=ctx.createPattern(nz,'repeat');
  const bursts=[[700,830,.45],[1010,1070,.3],[1180,1260,.55]], t0=performance.now();
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const frame=now=>{
    const t=now-t0-PRE; ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
    if(t<520) ctx.clearRect(0,0,w,h); else { ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h); }
    if(t<-700){ if(t>-1000&&t<-720&&Math.random()<.35){ // "tzzz": só um risco de luz fino a passar, o fundo não muda
        ctx.fillStyle='rgba(255,255,255,.45)'; ctx.fillRect(0,rnd(h*.35,h*.65),w,rnd(1,2)); } }
    else if(t<260){ // a TV liga devagar: linha que se estende, tremeluz e fica a brilhar
      const p=Math.min(1,(t+700)/650), lw=w*(1-Math.pow(1-p,3)), fl=t>-50?1:.75+Math.random()*.25;
      ctx.globalAlpha=fl; ctx.fillStyle='#fff'; ctx.shadowColor='#fff'; ctx.shadowBlur=10+8*Math.max(0,Math.sin((t+700)/90)); ctx.fillRect((w-lw)/2,h/2-1,lw,2); ctx.shadowBlur=0; ctx.globalAlpha=1;
    } else if(t<520){ // abre na vertical
      const p=(t-260)/260, e=1-Math.pow(1-p,3), vh2=Math.max(2,h*e);
      ctx.drawImage(base,0,(h-vh2)/2,w,vh2); ctx.globalAlpha=.6*(1-p); ctx.fillStyle='#fff'; ctx.fillRect(0,(h-vh2)/2,w,vh2); ctx.globalAlpha=1;
    } else {
      // intensidade da falha
      let g=0; bursts.forEach(([a,z,v])=>{ if(t>a&&t<z) g=Math.max(g,v*(.6+Math.random()*.4)); });
      if(t>1500) g=Math.max(g,Math.min(1,(t-1500)/600)**1.6);
      if(Math.random()<.03) g=Math.max(g,.15);
      // rolar na vertical (perda de sincronismo) entre 1180 e 1300
      const roll=(t>1180&&t<1320)?((t-1180)/140)*h*.9:0;
      if(g<.02){ ctx.drawImage(base,0,0); }
      else {
        const off=[rnd(4,14)*g*(w/360),0,-rnd(4,14)*g*(w/360)];
        ctx.globalCompositeOperation='lighter';
        let y=0;
        while(y<h){ const bh=Math.max(2,Math.round(rnd(2,h*(.04+.1*g)))); const shift=Math.random()<.35+.4*g?rnd(-1,1)*w*.22*g:0;
          for(let c=0;c<3;c++){ const sy=((y+roll)%h+h)%h, hh=Math.min(bh,h-sy);
            ctx.drawImage(chans[c],0,sy,w,hh,shift+off[c],y,w,hh); if(hh<bh) ctx.drawImage(chans[c],0,0,w,bh-hh,shift+off[c],y+hh,w,bh-hh);
            if(shift>0) ctx.drawImage(chans[c],w-shift,sy,shift,hh,off[c],y,shift,hh); else if(shift<0) ctx.drawImage(chans[c],0,sy,-shift,hh,w+shift+off[c],y,-shift,hh); }
          y+=bh; }
        ctx.globalCompositeOperation='source-over';
        if(g>.45){ // blocos de compressão
          const n=Math.round(g*34); for(let i=0;i<n;i++){ const s=Math.round(rnd(8,34)*(w/360)), bx=rnd(0,w-s), by=rnd(0,h-s);
            if(Math.random()<.5) ctx.drawImage(base,rnd(0,w-s),rnd(0,h-s),s,s,bx,by,s*rnd(1,3),s); else { ctx.fillStyle=pick(['#C000C0','#00C0C0','#131313','#C0C000','#0000C0']); ctx.fillRect(bx,by,s*rnd(1,4),s*rnd(.3,1)); } } }
        if(Math.random()<.25*g){ ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fillRect(0,rnd(0,h),w,rnd(1,3)); }
      }
      // grão e oscilação de brilho
      ctx.globalAlpha=.07+.28*g; ctx.fillStyle=grain; ctx.save(); ctx.translate(rnd(0,128),rnd(0,128)); ctx.fillRect(-128,-128,w+256,h+256); ctx.restore(); ctx.globalAlpha=1;
      if(Math.random()<.05+.15*g){ ctx.fillStyle=`rgba(0,0,0,${rnd(.15,.45)})`; ctx.fillRect(0,0,w,h); }
    }
    if(t<dur&&tPlaying) bgRaf=requestAnimationFrame(frame);
  };
  bgRaf=requestAnimationFrame(frame);
}
let tT=[], tI=null, tPlaying=false, tStart=0;
const PRE=1000; // a TV liga devagar durante 1 s antes de tudo o resto
const tAt=(ms,fn)=>tT.push(setTimeout(fn,ms+PRE));
function tShow(id){ tsc.querySelectorAll('.ts').forEach(x=>x.classList.toggle('show',x.id===id)); }
function frames(id,start,every){
  const fs=[...document.getElementById(id).querySelectorAll('.fr')];
  fs.forEach((f,k)=>tAt(start+k*every,()=>{ fs.forEach(x=>x.classList.remove('on')); f.classList.add('on'); const c=f.querySelector('canvas.conf'); if(c) confetti(c,'fall'); }));
}
function playTrailer(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  stopTrailer(); tPlaying=true; tStart=performance.now();
  tr.classList.remove('gone','closing'); void tr.offsetWidth; tr.classList.add('playing');
  const odo=document.getElementById('odo'), digits=[...odo.querySelectorAll('i:not(.gap)')];
  odo.classList.remove('rolling'); digits.forEach(d=>d.textContent='0');
  tShow('t1'); barsGlitch(PRE+2200);
  tAt(2200,()=>tShow('t2'));
  tAt(3800,()=>tShow('t3')); frames('t3',3800,420);
  tAt(5500,()=>{ tShow('t4'); odo.classList.add('rolling'); tI=setInterval(()=>digits.forEach(d=>d.textContent=Math.floor(Math.random()*10)),60); });
  tAt(7000,()=>{ clearInterval(tI); odo.classList.remove('rolling'); digits.forEach((d,k)=>setTimeout(()=>d.textContent='?',k*70)); });
  // pódio com câmara: 3.º em grande no centro → câmara recua e vai para a esquerda, entra o 2.º → recua de vez e sobe o 1.º ao meio
  const pw=document.getElementById('podium');
  const podCam=(pos,z,dur)=>{ const cw=pw.offsetWidth/3; pw.style.transition=dur?`transform ${dur}s cubic-bezier(.65,0,.25,1)`:'none'; pw.style.transform=`scale(${z}) translateX(${-pos*cw}px)`; };
  tAt(7700,()=>{ tShow('t5'); pw.querySelectorAll('.pcol').forEach(c=>c.classList.remove('up')); podCam(1,2.1,0); });
  tAt(7750,()=>pw.querySelector('.p3').classList.add('up'));
  tAt(8150,()=>podCam(-1,1.4,.5));
  tAt(8250,()=>pw.querySelector('.p2').classList.add('up'));
  tAt(8650,()=>podCam(0,1,.5));
  tAt(8780,()=>{ pw.querySelector('.p1').classList.add('up'); });
  tAt(10100,()=>{ // a cena anterior sobe como um swipe e o feed entra por baixo
    const t5=document.getElementById('t5'), t6=document.getElementById('t6'), tt=document.getElementById('ttouch');
    t6.classList.add('show','enter'); t5.classList.add('swipeout');
    tt.classList.remove('go'); void tt.offsetWidth; tt.classList.add('go');
    setTimeout(()=>{ t5.classList.remove('show','swipeout'); t6.classList.remove('enter'); },620); });
  phoneMoment();
  tAt(14750,()=>tShow('t8')); frames('t8',14750,170);
  tAt(15800,endTrailer);
}
function stopTrailer(){ tT.forEach(clearTimeout); tT=[]; clearInterval(tI); const c=document.getElementById('tconf'); if(c){ stopConfetti(c); c.getContext('2d').clearRect(0,0,c.width,c.height); } }
function endTrailer(skipped){
  if(!tPlaying) return; tPlaying=false; stopTrailer(); if(skipped){ if(Snd.running()) Snd.skip(); else unlock(); }
  tr.classList.remove('playing'); tr.classList.add('closing');
  setTimeout(()=>{ tr.classList.add('gone'); tr.classList.remove('closing'); tsc.querySelectorAll('.show,.on').forEach(x=>x.classList.remove('show','on')); },420);
  show(0,true,true);
}
['pointerdown','pointerup'].forEach(ev=>tr.addEventListener(ev,e=>e.stopPropagation()));
tr.addEventListener('click',e=>{ e.stopPropagation(); if(e.target.closest('#tskip')) endTrailer(true); });
addEventListener('keydown',e=>{ if(tPlaying&&['ArrowRight',' ','Enter','Escape','ArrowLeft'].includes(e.key)){ e.preventDefault(); e.stopImmediatePropagation(); endTrailer(true); } },true);

document.getElementById('again').onclick=e=>{ chatStop(); e.stopPropagation(); slides[cur].classList.remove('on'); cur=-1; show(0,true,true); setTimeout(()=>{ playTrailer(); if(Snd.running()){ unlocked=true; Snd.trailer(0); } sndUi(); },50); };
cur=-1; show(0,true,true);
/* arranca logo; se o browser bloquear o som até haver um toque, o som entra no primeiro toque já sincronizado com o trailer */
const sndBtn=document.getElementById('sndbtn');
function sndUi(){ const blocked=!Snd.running(); sndBtn.classList.toggle('off',blocked||Snd.muted); sndBtn.classList.toggle('wait',blocked); sndBtn.setAttribute('aria-label',(blocked||Snd.muted)?'Ligar som':'Desligar som'); }
let unlocked=false;
function unlock(){ if(unlocked) return; const g=document.getElementById('gate'); if(g&&!g.classList.contains('gone')) return; Snd.init().then(()=>{ if(!Snd.running()||unlocked) return; unlocked=true;
  if(tPlaying) Snd.trailer(performance.now()-tStart); sndUi(); }); }
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,unlock,{capture:true}));
Snd.create();
if(matchMedia('(prefers-reduced-motion: reduce)').matches){ setTimeout(()=>{ if(Snd.running()) unlocked=true; sndUi(); },60); }
else {
  /* ecrã inicial com um único botão: o toque garante que o som arranca */
  const gate=document.getElementById('gate'), syncBtn=document.getElementById('syncbtn');
  ['pointerdown','pointerup','click'].forEach(ev=>gate.addEventListener(ev,e=>e.stopPropagation()));
  const start=()=>{ if(gate.classList.contains('leaving')) return; gate.classList.add('leaving');
    const ready=Snd.init();   // tem de ser chamado já, dentro do clique
    ready.then(()=>{ if(Snd.running()) Snd.E.tzz(undefined,.42,.3); });   // tzzz… a palavra falha e apaga-se
    setTimeout(()=>ready.then(()=>{ gate.classList.add('gone'); unlocked=Snd.running(); playTrailer(); if(unlocked) Snd.trailer(0); sndUi(); }),1500); };
  syncBtn.addEventListener('click',e=>{ e.stopPropagation(); start(); });
  addEventListener('keydown',e=>{ if(!gate.classList.contains('gone')&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); e.stopImmediatePropagation(); start(); } },true);
  setTimeout(sndUi,60);
}
/* botão de som */
['pointerdown','pointerup'].forEach(ev=>sndBtn.addEventListener(ev,e=>e.stopPropagation()));
sndBtn.addEventListener('click',e=>{ e.stopPropagation(); if(!unlocked){ unlock(); return; } Snd.toggle(); sndUi(); });

/* REC a piscar: depois do trailer, o único som de fundo é o bip discreto da câmara, em sincronia com o ponto vermelho */
let recPh=0;
setInterval(()=>{ recPh^=1; app.classList.toggle('recoff',!recPh);
  const g=document.getElementById('gate'); if(recPh&&!tPlaying&&unlocked&&Snd.running()&&!Snd.muted&&(!g||g.classList.contains('gone'))) Snd.E.rec(); },600);
