<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>farmerrr — Recap de setembro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E0F13;--ink2:#1A1C23;--paper:#F3F0E8;--tally:#FF4A2E;--chroma:#2BE07A;--amber:#FFB31A;--steel:#8A8F9C;--page:#0E0F13;
  --disp:"Unbounded","Arial Black",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs-h:clamp(17px,min(5.2vw,calc(var(--vh,1vh)*3.1)),36px);--fs-sub:clamp(12px,min(3.6vw,calc(var(--vh,1vh)*2.1)),19px);--fs-mono:clamp(10px,min(3vw,calc(var(--vh,1vh)*1.6)),14px);
  --fs-mega:clamp(46px,min(18.5vw,calc(var(--vh,1vh)*11)),200px);--fs-num:clamp(34px,min(12.5vw,calc(var(--vh,1vh)*7.2)),140px);
  --fs-name:clamp(20px,min(6.6vw,calc(var(--vh,1vh)*4)),60px);--fs-recap:clamp(52px,min(19vw,calc(var(--vh,1vh)*11)),220px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--page:#0E0F13}}
:root[data-theme="light"]{--page:#0E0F13}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--page)}
body{font-family:var(--disp);-webkit-font-smoothing:antialiased}
p,h1,ol{margin:0}
.app{position:fixed;inset:0;overflow:hidden;background:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}

/* topo */
.top{position:absolute;z-index:20;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;pointer-events:none;color:var(--paper);transition:color .3s}
.app.lightui .top{color:var(--ink)}
.bars{display:flex;gap:4px;max-width:1400px;margin:0 auto}
.bars i{flex:1;height:3px;border-radius:2px;background:currentColor;opacity:.22}
.bars i.done{opacity:1}
.brand{text-align:center;font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:-.02em;margin-top:9px}

/* temas */
.t-ink{background:var(--ink);color:var(--paper);--fg:var(--paper);--acc:var(--amber);--soft:rgba(243,240,232,.14)}
.t-paper{background:var(--paper);color:var(--ink);--fg:var(--ink);--acc:var(--tally);--soft:rgba(14,15,19,.1)}
.t-chroma{background:var(--chroma);color:var(--ink);--fg:var(--ink);--acc:var(--ink);--soft:rgba(14,15,19,.14)}
.t-tally{background:var(--tally);color:var(--paper);--fg:var(--paper);--acc:var(--paper);--soft:rgba(243,240,232,.2)}
.t-amber{background:var(--amber);color:var(--ink);--fg:var(--ink);--acc:var(--ink);--soft:rgba(14,15,19,.14)}

/* slides: só o ativo existe no ecrã (poupa bateria e evita bugs) */
.slide{position:absolute;inset:0;display:none;overflow:hidden}
.slide.on{display:block;z-index:3;animation:tvon .75s cubic-bezier(.2,.9,.25,1) .28s both}
.slide.leaving{display:block;z-index:2;animation:tvoff .36s cubic-bezier(.6,0,.85,.3) both}
@keyframes tvon{0%{transform:scale(.25,.004)}35%{transform:scale(1,.004)}75%{transform:scale(1,1.015)}100%{transform:none}}
@keyframes tvoff{0%{transform:none}65%{transform:scale(1,.004)}100%{transform:scale(0,.004)}}
.flash{position:absolute;inset:0;z-index:30;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .6s ease-out .3s}
@keyframes flash{0%{opacity:0}10%{opacity:.75}100%{opacity:0}}

.body{position:relative;z-index:4;height:100%;width:100%;max-width:var(--mw,620px);margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 74px) 22px calc(env(safe-area-inset-bottom,0px) + var(--pb,0px) + 26px)}

/* moldura de câmara + HUD */
.vf{position:absolute;z-index:3;pointer-events:none;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 40px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);opacity:.55;
  --c:var(--fg);--l:clamp(14px,calc(var(--vh,1vh)*2.6),26px);
  background:linear-gradient(var(--c),var(--c)) 0 0/var(--l) 2px no-repeat,linear-gradient(var(--c),var(--c)) 0 0/2px var(--l) no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 0/var(--l) 2px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/2px var(--l) no-repeat,
  linear-gradient(var(--c),var(--c)) 0 100%/var(--l) 2px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/2px var(--l) no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 100%/var(--l) 2px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/2px var(--l) no-repeat}
.hud{position:absolute;z-index:5;left:24px;right:24px;top:calc(env(safe-area-inset-top,0px) + 50px);display:flex;justify-content:space-between;font-family:var(--mono);font-weight:500;font-size:var(--fs-mono);letter-spacing:.06em;opacity:.8;pointer-events:none}
.rec::before{content:"";display:inline-block;width:.75em;height:.75em;border-radius:50%;background:var(--tally);margin-right:.5em;vertical-align:-.05em}
.app.recoff .rec::before{opacity:0}
.t-tally .rec::before{background:var(--paper)}
@keyframes blink{50%{opacity:0}}
.scan::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}

/* tipografia */
.h{font-weight:700;font-size:var(--fs-h);line-height:1.1;letter-spacing:-.02em}
.sub{font-family:var(--mono);font-size:var(--fs-sub);line-height:1.4;margin-top:.6em;opacity:.85}
.sub b{font-weight:700}
.mono{font-family:var(--mono);font-weight:500;font-size:var(--fs-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.mega{font-weight:900;font-size:var(--fs-mega);line-height:.95;letter-spacing:-.04em;color:var(--acc);white-space:nowrap;margin:.12em 0 .12em;font-variant-numeric:tabular-nums}
.ghost{text-shadow:-.035em 0 0 rgba(255,74,46,.55),.035em 0 0 rgba(43,224,122,.55)}
.tag{display:inline-block;font-family:var(--mono);font-weight:700;font-size:var(--fs-mono);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:6px;padding:.45em .8em;margin-top:.4em}

/* entradas */
.a{opacity:0}
.on .a{animation:up .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0s) + .75s)}
.on .glitch{animation-name:glitch;animation-duration:.6s;animation-timing-function:steps(1,end)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes glitch{0%{opacity:0}10%{opacity:1;transform:translate(-6px,0) skewX(-8deg)}25%{transform:translate(5px,0)}40%{transform:translate(-3px,0) skewX(4deg)}55%{transform:translate(2px,0)}70%,100%{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}

/* ===== efeitos de fundo ===== */
.fx{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
/* equalizador */
.eq{position:absolute;left:0;right:0;bottom:0;height:var(--eh,calc(var(--vh,1vh)*14));display:flex;align-items:flex-end;gap:3px;padding:0 3px}
.eq i{flex:1;height:100%;background:var(--eqc,var(--soft));border-radius:3px 3px 0 0;transform-origin:50% 100%;animation:eq var(--du) ease-in-out var(--dl) infinite alternate}
@keyframes eq{from{transform:scaleY(.08)}to{transform:scaleY(var(--h))}}
/* chat a subir (abstrato) */
.chat{position:absolute;top:0;bottom:0;right:3%;width:min(30vw,300px);overflow:hidden;opacity:.55;
  -webkit-mask:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.chat.l{right:auto;left:3%}
.chat-in{animation:chatup var(--cd,16s) linear infinite}
@keyframes chatup{to{transform:translateY(-50%)}}
.msg{display:flex;gap:7px;align-items:center;margin:11px 0}
.msg .av{width:12px;height:12px;border-radius:50%;flex:none}
.msg .bl{height:9px;border-radius:5px;width:var(--w);background:var(--soft)}
/* reações a flutuar */
.pp{position:absolute;bottom:-6%;width:var(--s);height:var(--s);border-radius:var(--br);background:var(--c);opacity:.85;animation:floatup var(--du) linear var(--dl) infinite}
@keyframes floatup{to{transform:translateY(-120vh) rotate(var(--r))}}
/* barras de cor */
.cbars{position:absolute;left:0;right:0;display:flex}
.cbars i{flex:1;transform-origin:50% 0}
:is(.on,.show) .cbars i{animation:barin .5s cubic-bezier(.2,.9,.2,1) both;animation-delay:var(--bd)}
@keyframes barin{from{transform:scaleY(0)}to{transform:none}}
/* gráfico a subir */
.spark{position:absolute;left:0;right:0;bottom:0;width:100%;height:var(--sh,calc(var(--vh,1vh)*30))}
.spark .ln{fill:none;stroke:var(--chroma);stroke-width:3;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1}
.spark .ar{opacity:0}
:is(.on,.show) .spark .ln{animation:draw 1.8s cubic-bezier(.4,0,.2,1) 1s forwards}
:is(.on,.show) .spark .ar{animation:fadein .8s ease 2.2s forwards}
@keyframes fadein{to{opacity:1}}

/* ===== componentes ===== */
.name{font-weight:700;font-size:var(--fs-name);letter-spacing:-.03em;line-height:1.05}
.recap{font-weight:900;font-size:var(--fs-recap);letter-spacing:-.04em;line-height:.95;margin:.15em 0 .2em}
.hint{margin-top:1.6em}
.hint::after{content:" ▸"}
.app.recoff .hint{visibility:hidden} /* pisca ao mesmo tempo que o REC */

.stats{display:grid;gap:clamp(10px,calc(var(--vh,1vh)*2.4),26px);margin-top:clamp(12px,calc(var(--vh,1vh)*2.6),28px);width:100%}
.stat .n{font-weight:900;font-size:var(--fs-num);line-height:.95;letter-spacing:-.04em;color:var(--acc);white-space:nowrap;font-variant-numeric:tabular-nums}

/* oráculos (lower thirds) */
.lts{display:grid;gap:clamp(7px,calc(var(--vh,1vh)*1.4),14px);width:100%;max-width:640px;margin-top:clamp(12px,calc(var(--vh,1vh)*2.6),28px)}
.lt{display:flex;align-items:stretch;height:clamp(36px,calc(var(--vh,1vh)*5.6),58px);text-align:left;clip-path:inset(0 100% 0 0)}
.on .lt,.show .lt{animation:ltin .6s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--d) + .75s)}
.show .lt{animation-delay:var(--d)}
@keyframes ltin{to{clip-path:inset(0 0 0 0)}}
.lt .k{flex:none;width:clamp(36px,calc(var(--vh,1vh)*5.6),58px);display:grid;place-items:center;background:var(--ink);color:var(--paper);font-weight:700;font-size:clamp(14px,calc(var(--vh,1vh)*2.2),22px)}
.lt .nm{flex:1;min-width:0;display:flex;align-items:center;padding:0 .9em;background:#fff;color:var(--ink);font-weight:700;font-size:clamp(14px,min(4.2vw,calc(var(--vh,1vh)*2.4)),26px);letter-spacing:-.02em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lt .nm span{overflow:hidden;text-overflow:ellipsis}
.lt .v{flex:none;display:grid;place-items:center;padding:0 .9em;background:var(--amber);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:clamp(12px,min(3.4vw,calc(var(--vh,1vh)*1.9)),18px)}
.lt.first{height:clamp(46px,calc(var(--vh,1vh)*7.4),76px)}
.lt.first .k{background:var(--tally);width:clamp(46px,calc(var(--vh,1vh)*7.4),76px);font-size:clamp(18px,calc(var(--vh,1vh)*2.8),30px)}
.lt.first .nm{font-size:clamp(17px,min(5.2vw,calc(var(--vh,1vh)*3)),34px)}
.lt .blk{display:inline-block;height:.7em;width:var(--bw);background:var(--ink);opacity:.85;border-radius:3px}
.solo-lt{width:auto;max-width:100%;margin:.7em 0 .2em;--d:.15s}
.solo-lt .nm{background:var(--ink);color:var(--paper)}
.t-ink .solo-lt .nm{background:#fff;color:var(--ink)}

/* miniaturas */
.thumb{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--g1),var(--g2));border-radius:10px}
.thumb::after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;margin:-8px 0 0 -4px;border-left:13px solid rgba(255,255,255,.95);border-top:8px solid transparent;border-bottom:8px solid transparent}
.thumb .dur{position:absolute;right:4px;bottom:4px;font-family:var(--mono);font-size:9px;font-weight:700;background:rgba(0,0,0,.65);color:#fff;padding:1px 4px;border-radius:3px}

/* quiz */
.opts{width:100%;max-width:560px;display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(7px,calc(var(--vh,1vh)*1.4),12px);margin-top:clamp(12px,calc(var(--vh,1vh)*2.4),26px)}
.opt{display:flex;align-items:center;gap:12px;padding:7px 12px 7px 7px;background:var(--ink2);color:var(--paper);border:1.5px solid rgba(243,240,232,.18);border-radius:14px;text-align:left;cursor:pointer;transition:background .3s,color .3s,border-color .3s,transform .15s}
.opt:active{transform:scale(.98)}
.opt .thumb{width:clamp(42px,calc(var(--vh,1vh)*6.6),64px);aspect-ratio:1;flex:none}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:clamp(12px,min(3.7vw,calc(var(--vh,1vh)*2)),18px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.opt .t span{font-family:var(--mono);font-size:clamp(10px,min(3vw,calc(var(--vh,1vh)*1.6)),13px);opacity:.7}
.opt .v{font-family:var(--mono);font-weight:700;font-size:clamp(12px,min(3.6vw,calc(var(--vh,1vh)*1.9)),16px);opacity:0;transition:opacity .3s}
.opt .mark{width:18px;font-weight:900;text-align:center}
.answered .opt .v{opacity:1}
.opt.right{background:var(--chroma);color:var(--ink);border-color:var(--chroma)}
.opt.wrong{background:var(--tally);border-color:var(--tally)}

/* clip do mês: leitor com marcas de entrada/saída */
.split-row{display:flex;flex-direction:column;align-items:center;width:100%}
.split-row .txt{display:flex;flex-direction:column;align-items:center}
.player{position:relative;width:min(44vw,calc(var(--vh,1vh)*26),300px);aspect-ratio:9/16;border-radius:18px;overflow:hidden;border:3px solid var(--ink);background:linear-gradient(160deg,var(--g1),var(--g2));box-shadow:10px 10px 0 rgba(14,15,19,.25);margin-bottom:clamp(12px,calc(var(--vh,1vh)*2.4),24px);transform:rotate(-2deg)}
.player::after{content:"";position:absolute;left:50%;top:44%;width:0;height:0;margin:-14px 0 0 -8px;border-left:24px solid #fff;border-top:15px solid transparent;border-bottom:15px solid transparent}
.player .badge{position:absolute;left:10px;top:10px;background:var(--tally);color:#fff;font-family:var(--mono);font-weight:700;font-size:11px;padding:3px 8px;border-radius:4px;letter-spacing:.06em}
.player .ttl{position:absolute;left:12px;right:12px;bottom:34px;color:#fff;font-weight:700;font-size:clamp(12px,min(3.6vw,calc(var(--vh,1vh)*1.9)),20px);line-height:1.1;text-align:left}
.scrub{position:absolute;left:12px;right:12px;bottom:16px;height:4px;background:rgba(255,255,255,.35);border-radius:2px}
.scrub .seg{position:absolute;left:24%;width:46%;top:-5px;bottom:-5px;border:2px solid var(--amber);border-radius:3px}
.scrub .phw{position:absolute;inset:0;animation:play 5s linear infinite}
.scrub .ph{position:absolute;left:0;top:-6px;width:3px;height:16px;background:#fff;border-radius:2px}
@keyframes play{from{transform:translateX(0)}to{transform:translateX(100%)}}

/* sinal (rating) */
.sig{display:flex;align-items:flex-end;gap:clamp(5px,calc(var(--vh,1vh)*1),9px);height:clamp(34px,calc(var(--vh,1vh)*6.4),70px);margin:.3em 0 .9em}
.sig i{width:clamp(10px,calc(var(--vh,1vh)*1.8),18px);height:calc(20% * var(--n));background:rgba(243,240,232,.16);border-radius:3px;position:relative;overflow:hidden}
.sig i::after{content:"";position:absolute;inset:0;background:var(--amber);transform-origin:50% 100%;transform:scaleY(0)}
.on .sig i::after,.show .sig i::after{animation:sfill .35s ease forwards;animation-delay:var(--d)}
@keyframes sfill{to{transform:scaleY(var(--f))}}

/* fecho */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(7px,calc(var(--vh,1vh)*1.4),14px);width:100%;max-width:680px;margin:clamp(12px,calc(var(--vh,1vh)*2.4),26px) 0}
.tile{background:var(--ink2);border:1.5px solid rgba(243,240,232,.18);border-radius:14px;padding:clamp(9px,calc(var(--vh,1vh)*1.6),16px) 10px;text-align:left}
.tile b{display:block;font-weight:900;font-size:clamp(18px,min(5.6vw,calc(var(--vh,1vh)*3.4)),42px);letter-spacing:-.03em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .mono{display:block;margin-top:.4em}
.tile.win{background:var(--tally);border-color:var(--tally)}
.tile.win b{font-size:clamp(14px,min(4.2vw,calc(var(--vh,1vh)*2.6)),30px);padding:.15em 0}
.next{font-weight:900;font-size:clamp(22px,min(7vw,calc(var(--vh,1vh)*4.2)),64px);letter-spacing:-.03em;line-height:1.05}
.again{margin-top:clamp(14px,calc(var(--vh,1vh)*2.6),28px);font-family:var(--mono);font-weight:700;font-size:clamp(12px,min(3.6vw,calc(var(--vh,1vh)*1.9)),16px);letter-spacing:.08em;text-transform:uppercase;padding:.9em 1.5em;border-radius:999px;border:0;background:var(--paper);color:var(--ink);cursor:pointer}
.again:focus-visible,.opt:focus-visible,.tskip:focus-visible{outline:3px solid var(--chroma);outline-offset:3px}

/* ===== ecrãs largos ===== */
@media (min-width:600px) and (min-aspect-ratio:5/4){
  :root{--fs-h:clamp(17px,min(2.4vw,calc(var(--vh,1vh)*4)),40px);--fs-sub:clamp(12px,min(1.4vw,calc(var(--vh,1vh)*2.4)),20px);--fs-mono:clamp(10px,min(1vw,calc(var(--vh,1vh)*1.8)),15px);
    --fs-mega:clamp(46px,min(11vw,calc(var(--vh,1vh)*19)),240px);--fs-num:clamp(34px,min(5.6vw,calc(var(--vh,1vh)*12)),150px);--fs-name:clamp(22px,min(4.4vw,calc(var(--vh,1vh)*7)),90px);--fs-recap:clamp(52px,min(12vw,calc(var(--vh,1vh)*17)),240px)}
  .body{max-width:var(--mww,1000px);padding-left:6vw;padding-right:6vw}
  .stats{grid-template-columns:repeat(3,1fr);gap:4vw}
  .split-row{flex-direction:row;justify-content:center;gap:7vw}
  .split-row .txt{align-items:flex-start;text-align:left}
  .player{width:min(22vw,calc(var(--vh,1vh)*52));margin:0}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr));max-width:1000px}
  .opts{max-width:700px}
  .lts{max-width:780px}
  .lt .nm{font-size:clamp(14px,min(1.8vw,calc(var(--vh,1vh)*3)),30px)}
  .lt.first .nm{font-size:clamp(17px,min(2.4vw,calc(var(--vh,1vh)*4)),40px)}
  .chat{width:min(22vw,320px)}
}

/* ===== trailer ===== */
.trailer{position:absolute;inset:0;z-index:40;background:var(--ink);overflow:hidden;cursor:pointer}
.trailer.closing{animation:tvoff .4s cubic-bezier(.6,0,.85,.3) forwards;pointer-events:none}
.trailer.gone{display:none}
.ts,.fr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:0 6vw}
.ts.show,.fr.on{display:flex}
.cap{position:relative;z-index:7;font-weight:700;font-size:clamp(16px,min(5vw,calc(var(--vh,1vh)*3.2)),40px);letter-spacing:-.02em;margin-top:1.2em;opacity:0}
.ts.show .cap{animation:up .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,.5s)}
.tw{position:relative;z-index:7;font-weight:900;letter-spacing:-.04em;line-height:.95;font-size:clamp(44px,min(16vw,calc(var(--vh,1vh)*10)),200px)}
.ts.show .tw,.fr.on .tw{animation:glitch .5s steps(1,end) both;animation-delay:var(--d,0s)}
.fr .mono{position:absolute;z-index:7;left:24px;top:calc(env(safe-area-inset-top,0px) + 24px)}
/* t1: ligar o sinal */
.t1line{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#fff;transform:scaleX(0)}
.ts.show .t1line{animation:t1l .5s cubic-bezier(.2,.9,.2,1) .1s forwards,vanish .01s 1s forwards}
@keyframes t1l{to{transform:scaleX(1)}}
@keyframes vanish{to{opacity:0}}
.t1bars{position:absolute;inset:0;transform:scaleY(.004);opacity:0}
.ts.show .t1bars{animation:t1b .45s cubic-bezier(.2,.9,.2,1) .7s forwards,jitter .5s steps(1) 1.4s 1}
@keyframes t1b{0%{opacity:1;transform:scaleY(.004)}100%{opacity:1;transform:none}}
@keyframes jitter{0%{transform:translateX(-4%)}20%{transform:translateX(3%) skewX(6deg)}40%{transform:translateX(-2%)}60%{transform:translateX(5%)}80%,100%{transform:none}}
.t1bars .cbars{inset:0}
.t1lab{position:absolute;z-index:7;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);left:0;right:0;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:#fff;opacity:0}
.ts.show .t1lab{animation:fadein .2s 1s forwards}
/* t4 contador */
.odo{display:flex;gap:clamp(4px,1vw,8px);position:relative;z-index:7}
.odo i{font-style:normal;display:grid;place-items:center;width:clamp(28px,min(9.4vw,calc(var(--vh,1vh)*6)),78px);aspect-ratio:.7;background:var(--ink2);color:var(--amber);border:1.5px solid rgba(243,240,232,.25);border-radius:8px;font-family:var(--mono);font-weight:700;font-size:clamp(22px,min(7.4vw,calc(var(--vh,1vh)*4.8)),62px)}
.odo i.gap{width:clamp(4px,1.4vw,12px);background:none;border:0}
.odo.rolling i:not(.gap){animation:roll .08s linear infinite}
@keyframes roll{50%{transform:translateY(5%)}}
/* t6 multivista */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,calc(var(--vh,1vh)*1.2),12px);width:min(78vw,calc(var(--vh,1vh)*46));position:relative;z-index:7}
.tgrid .thumb{aspect-ratio:9/12;opacity:0;transition:opacity .4s,filter .4s}
.ts.show .tgrid .thumb{animation:tilein .4s cubic-bezier(.2,1,.3,1) forwards;animation-delay:var(--d)}
@keyframes tilein{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.tgrid.focus .thumb{opacity:.12!important;filter:blur(3px)}
.tgrid.focus .thumb.mid{opacity:1!important;filter:blur(9px);transform:scale(2.3)!important;z-index:2;transition:transform .7s cubic-bezier(.2,1,.3,1),filter .4s;animation:none}
/* controlos */
.tskip{position:absolute;z-index:50;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:.6em 1em;border-radius:999px;border:1.5px solid rgba(243,240,232,.5);background:rgba(14,15,19,.75);color:var(--paper);cursor:pointer}
.tprog{position:absolute;z-index:50;left:0;bottom:0;height:3px;width:100%;background:var(--tally);transform-origin:left;transform:scaleX(0)}
.trailer.playing .tprog{animation:prog 16.8s linear forwards}
@keyframes prog{to{transform:scaleX(1)}}

@media (prefers-reduced-motion: reduce){
  .slide.on,.slide.leaving{animation:none}
  .on .a{animation:up .01s both!important}
  .eq i,.chat-in,.pp,.scrub .phw,.rec::before{animation:none!important}
}

/* ===== v7: transições variadas ===== */
.slide.on{animation:none}
.slide.leaving{animation:none}
.slide.on.tx-tv{animation:tvon .75s cubic-bezier(.2,.9,.25,1) .28s both}
.slide.leaving.lv-tv{animation:tvoff .36s cubic-bezier(.6,0,.85,.3) both}
.slide.on.tx-zoom{animation:zin .7s cubic-bezier(.2,.9,.2,1) both}
.slide.leaving.lv-zoom{animation:zout .5s ease both}
@keyframes zin{from{opacity:0;transform:scale(1.22)}to{opacity:1;transform:none}}
@keyframes zout{to{opacity:0;transform:scale(.9)}}
.slide.on.tx-pip{animation:pip .8s cubic-bezier(.2,.9,.2,1) both}
.slide.leaving.lv-pip{animation:pipout .8s ease both}
@keyframes pip{from{transform:translate(30%,32%) scale(.3);border-radius:34px;box-shadow:0 30px 80px rgba(0,0,0,.6)}to{transform:none;border-radius:0}}
@keyframes pipout{to{transform:scale(.94);opacity:.5}}
.slide.on.tx-glitch{animation:gl .6s steps(1,end) both}
.slide.leaving.lv-glitch{animation:glout .3s steps(1,end) both}
@keyframes gl{0%{opacity:0}12%{opacity:1;transform:translateX(-7%) skewX(9deg)}24%{transform:translateX(6%) scaleY(1.04)}36%{transform:translateX(-3%) skewX(-5deg)}50%{transform:translateX(2%)}64%,100%{opacity:1;transform:none}}
@keyframes glout{0%{transform:none}30%{transform:translateX(5%) skewX(-8deg)}60%{transform:translateX(-4%)}100%{opacity:0}}
.slide.on.tx-static{animation:stin 1.3s steps(1,end) both}
.slide.leaving.lv-static{animation:none}
@keyframes stin{0%,44%{opacity:0}45%,100%{opacity:1}}
.slide.on.tx-wipe{animation:wipe .75s cubic-bezier(.6,0,.3,1) both}
@keyframes wipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.noise{position:absolute;inset:0;width:100%;height:100%;z-index:31;pointer-events:none;opacity:0;display:block;filter:contrast(1.3) blur(.4px)}
.vign{position:absolute;inset:0;z-index:32;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.scanbar{position:absolute;left:0;right:0;top:0;height:3px;z-index:32;pointer-events:none;background:#fff;box-shadow:0 0 18px 6px rgba(255,255,255,.55);opacity:0}
.scanbar.go{animation:scanb .75s cubic-bezier(.6,0,.3,1)}
@keyframes scanb{0%{opacity:1;transform:translateY(0)}95%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--vh,1vh)*100))}}

/* ===== v7: chat ao vivo ===== */
.two{display:flex;flex-direction:column;align-items:center;width:100%;gap:clamp(12px,calc(var(--vh,1vh)*2.2),22px)}
.two .rank{width:100%;display:flex;flex-direction:column;align-items:center}
.chatbox{width:100%;max-width:640px;height:var(--ch,calc(var(--vh,1vh)*25));background:#16181E;color:var(--paper);border-radius:16px;box-shadow:0 18px 40px rgba(14,15,19,.28);display:flex;flex-direction:column;overflow:hidden;text-align:left;font-family:var(--mono)}
.chat-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid rgba(243,240,232,.08);font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:-.01em}
.chat-hd .ld{width:7px;height:7px;border-radius:50%;background:var(--tally);animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,74,46,.6)}100%{box-shadow:0 0 0 8px rgba(255,74,46,0)}}
.chat-hd .vc{margin-left:auto;font-family:var(--mono);font-weight:500;font-size:11px;opacity:.65}
.chat-list{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:4px 10px 6px;gap:2px;-webkit-mask:linear-gradient(transparent,#000 24%);mask:linear-gradient(transparent,#000 24%)}
.cm{flex:none;font-size:clamp(11px,min(3.3vw,calc(var(--vh,1vh)*1.75)),14px);line-height:1.45;padding:3px 6px;border-radius:6px;animation:cmin .32s cubic-bezier(.2,.9,.2,1) both;word-break:break-word}
@keyframes cmin{from{opacity:0;transform:translateY(12px);background:rgba(243,240,232,.09)}to{opacity:1;transform:none;background:transparent}}
.cm .bd{display:inline-block;width:.95em;height:.95em;border-radius:3px;margin-right:5px;vertical-align:-.12em}
.cm b{font-weight:700}
.cm .tx{color:rgba(243,240,232,.92)}
.cm.hl{background:rgba(255,179,26,.12);border-left:3px solid var(--amber);border-radius:4px 6px 6px 4px;animation:cmin2 .32s cubic-bezier(.2,.9,.2,1) both}
@keyframes cmin2{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.cm.ev{margin:4px 0;padding:8px 10px;border-radius:10px;background:linear-gradient(100deg,rgba(43,224,122,.24),rgba(90,169,255,.2));border:1px solid rgba(43,224,122,.45);font-weight:700;animation:cmin2 .4s cubic-bezier(.2,1.3,.4,1) both}
.cm.ev .tx{color:#fff}
.chat-in{margin:0 10px 10px;padding:9px 12px;border-radius:9px;background:rgba(243,240,232,.06);font-size:11px;opacity:.6;display:flex;justify-content:space-between}
.chat-in::after{content:"↵"}

/* ===== v7: linha temporal de montagem ===== */
.tl{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);height:var(--th,calc(var(--vh,1vh)*13));z-index:2}
.tl .ruler{height:14px;margin-bottom:6px;background-image:repeating-linear-gradient(90deg,rgba(14,15,19,.25) 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,rgba(14,15,19,.5) 0 1px,transparent 1px 50px);background-size:100% 6px,100% 14px;background-repeat:no-repeat;background-position:0 100%,0 0}
.tl .lane{height:calc(100% - 20px);overflow:hidden}
.tl .trk{display:flex;gap:5px;height:100%;width:max-content;animation:tlpan 34s linear infinite}
.tl .blk{height:100%;width:var(--w);border-radius:7px;background:linear-gradient(160deg,var(--g1),var(--g2));position:relative;flex:none}
.tl .blk::after{content:"";position:absolute;left:8px;right:8px;bottom:8px;height:3px;border-radius:2px;background:rgba(255,255,255,.55)}
@keyframes tlpan{to{transform:translateX(-50%)}}
.tl .ph{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--tally);z-index:3}
.tl .ph::before{content:"";position:absolute;left:-6px;top:-2px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--tally)}
.on .tl{animation:up .6s ease 1s both}

/* ===== v7: calendário de publicações ===== */
.cal{margin-top:clamp(10px,calc(var(--vh,1vh)*2),20px);display:grid;grid-template-columns:repeat(7,var(--cs));gap:var(--cg);--cs:clamp(16px,min(6.4vw,calc(var(--vh,1vh)*3.4)),46px);--cg:clamp(3px,calc(var(--vh,1vh)*.6),7px)}
.cal .wd{font-family:var(--mono);font-size:clamp(9px,calc(var(--vh,1vh)*1.3),12px);font-weight:700;text-align:center;opacity:.55;padding-bottom:2px}
.cal .c{width:var(--cs);height:var(--cs);border-radius:clamp(4px,calc(var(--vh,1vh)*.8),8px);background:rgba(14,15,19,var(--o));transform:scale(0)}
.cal .c.x{background:transparent}
.on .cal .c{animation:cellin .35s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:var(--d)}
@keyframes cellin{to{transform:none}}
.cal .c.max{background:var(--ink);box-shadow:0 0 0 2px var(--amber),0 0 0 4px var(--ink)}
.on .cal .c.max{animation:cellin .35s cubic-bezier(.3,1.5,.5,1) forwards,maxp 1.2s ease-in-out infinite alternate;animation-delay:var(--d),calc(var(--d) + .4s)}
@keyframes maxp{to{box-shadow:0 0 0 2px var(--amber),0 0 0 6px var(--ink)}}
.calcap{margin-top:.8em}

/* ===== v7: agosto vs setembro ===== */
.cmp{position:relative;display:flex;align-items:flex-end;gap:clamp(22px,6vw,56px);height:var(--cmh,calc(var(--vh,1vh)*19));margin:clamp(30px,calc(var(--vh,1vh)*4.4),46px) 0 26px;padding:0 clamp(12px,3vw,30px);
  background:repeating-linear-gradient(0deg,rgba(243,240,232,.08) 0 1px,transparent 1px 25%);border-bottom:1.5px solid rgba(243,240,232,.35)}
.cmp .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:clamp(48px,14vw,110px);position:relative}
.cmp .bar{width:100%;height:var(--h);border-radius:10px 10px 2px 2px;transform-origin:50% 100%;transform:scaleY(0)}
.cmp .bar.prev{background:var(--steel)}
.cmp .bar.now{background:linear-gradient(180deg,#8BFFBE,var(--chroma));box-shadow:0 0 34px rgba(43,224,122,.4)}
.on .cmp .bar{animation:barup .9s cubic-bezier(.25,1.35,.45,1) forwards;animation-delay:var(--d)}
@keyframes barup{to{transform:none}}
.cmp .val{position:absolute;left:50%;bottom:calc(var(--h) + 8px);transform:translateX(-50%);font-family:var(--mono);font-weight:700;font-size:clamp(11px,calc(var(--vh,1vh)*1.7),15px);white-space:nowrap;opacity:0}
.on .cmp .val{animation:fadein .4s ease forwards;animation-delay:calc(var(--d) + .7s)}
.cmp .lab{position:absolute;top:calc(100% + 7px);font-family:var(--mono);font-size:clamp(10px,calc(var(--vh,1vh)*1.5),13px);font-weight:700;letter-spacing:.08em;opacity:.7}

@media (min-width:600px) and (min-aspect-ratio:5/4){
  .two{flex-direction:row;align-items:center;gap:5vw}
  .two .rank{flex:1.2}
  .chatbox{flex:1;max-width:420px;height:min(calc(var(--vh,1vh)*68),640px)}
  .cal{--cs:clamp(16px,min(3vw,calc(var(--vh,1vh)*4.2)),52px)}
}
@media (prefers-reduced-motion: reduce){.tl .trk,.chat-hd .ld{animation:none!important}}

/* ===== trailer t6: alguém a fazer scroll e um clip a rebentar ===== */
.cam{position:absolute;inset:0;z-index:7;overflow:hidden;background:#000}
.phone{position:absolute;inset:0;will-change:transform}
.feed{position:absolute;inset:0;transition:transform .26s cubic-bezier(.25,.9,.3,1)}
.vid{position:absolute;left:0;right:0;height:100%;overflow:hidden;background:linear-gradient(170deg,var(--g1),var(--g2))}
.vid .blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.75}
.vid .meta{position:absolute;left:5%;right:22%;bottom:calc(env(safe-area-inset-bottom,0px) + 7%);max-width:420px}
.vid .meta i{display:block;height:min(calc(var(--vh,1vh)*1.1),9px);border-radius:4px;background:rgba(255,255,255,.85);margin-top:6px}
.vid .meta i.u{width:45%;height:min(calc(var(--vh,1vh)*1.5),12px);background:#fff}
.vid .meta i.l1{width:90%;opacity:.7}.vid .meta i.l2{width:62%;opacity:.55}
.vid .pbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25)}
.vid .pbar b{display:block;height:100%;width:100%;background:#fff;transform-origin:left;transform:scaleX(.1)}
.vid.live .pbar b{animation:pfill 3s linear forwards}
@keyframes pfill{to{transform:scaleX(.9)}}
.rail{position:absolute;z-index:8;will-change:transform;right:max(3%,10px);bottom:calc(env(safe-area-inset-bottom,0px) + 14%);display:flex;flex-direction:column;align-items:center;gap:min(calc(var(--vh,1vh)*2.6),5vw,26px)}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff}
.act svg{width:min(9.5vw,calc(var(--vh,1vh)*4.6),52px);height:auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));transition:transform .2s}
.act span{font-family:var(--mono);font-weight:700;font-size:min(3.2vw,calc(var(--vh,1vh)*1.6),15px);text-shadow:0 1px 3px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.act.hrt.on svg path{fill:var(--tally);stroke:var(--tally)}
.act.hrt.on svg{animation:hpop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes hpop{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.act.bump svg{transform:scale(1.18)}
.fh{position:absolute;z-index:6;width:min(5vw,calc(var(--vh,1vh)*2.6),26px);color:var(--tally);pointer-events:none;animation:fh 1s ease-out forwards}
@keyframes fh{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--fx),-120px) scale(1.2) rotate(var(--fr))}}
.touch{position:absolute;z-index:7;left:55%;top:70%;width:min(11vw,calc(var(--vh,1vh)*6),52px);aspect-ratio:1;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.45);box-shadow:0 0 0 6px rgba(255,255,255,.15);opacity:0}
.touch.swipe{animation:swipe .26s cubic-bezier(.4,0,.2,1)}
@keyframes swipe{0%{opacity:0;transform:translateY(0) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1)}85%{opacity:.9;transform:translateY(-40vh)}100%{opacity:0;transform:translateY(-44vh)}}
/* like final */
.burst{position:absolute;z-index:7;width:0;height:0;pointer-events:none}
.burst .ring{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:3px solid var(--tally);opacity:0}
.burst.go .ring{animation:ring .55s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes ring{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.55)}}
.burst i{position:absolute;left:-1.5px;top:-4px;width:3px;height:8px;border-radius:2px;background:var(--tally);opacity:0;transform:rotate(var(--a)) translateY(-12px)}
.burst.go i{animation:spark .5s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateY(-12px) scaleY(.4)}60%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(-30px) scaleY(1)}}
.touch.tap{animation:tap .45s ease-out}
@keyframes tap{0%{opacity:0;transform:scale(1.4)}25%{opacity:.9;transform:scale(.85)}60%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}
.act.hrt.liked svg{animation:hlike .5s cubic-bezier(.3,1.9,.5,1)}
.act.hrt.liked svg path{fill:var(--tally);stroke:var(--tally)}
@keyframes hlike{0%{transform:scale(.4)}55%{transform:scale(1.5)}100%{transform:scale(1)}}
/* no computador: o feed fica do tamanho de um ecrã de telemóvel, sem moldura */
@media (min-width:600px) and (min-aspect-ratio:5/4){
  .cam{inset:auto;left:50%;top:53%;height:calc(var(--vh,1vh)*84);aspect-ratio:9/16;transform:translate(-50%,-50%);border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.65)}
  .act svg{width:min(3.4vw,calc(var(--vh,1vh)*4.2),46px)}
  .act span{font-size:min(1.2vw,calc(var(--vh,1vh)*1.5),14px)}
  .fh{width:min(2vw,calc(var(--vh,1vh)*2.4),24px)}
  .touch{width:min(calc(var(--vh,1vh)*5),48px)}
}

/* t1 com falha de sinal desenhada em canvas */
.t1c{position:absolute;inset:0;width:100%;height:100%;display:block;filter:blur(.3px) saturate(1.05)}
.t1scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45) 100%)}
.ts.show .t1lab{animation:fadein .2s 1.6s forwards,blink 1s steps(1) 1.8s infinite}

/* ligação t5 → t6: a cena sobe como um swipe do TikTok */
.ts.swipeout{z-index:6;animation:tswipe .6s cubic-bezier(.55,0,.2,1) forwards}
@keyframes tswipe{to{transform:translateY(-100%)}}
.ts.enter{z-index:5;animation:tenter .6s cubic-bezier(.55,0,.2,1) both}
@keyframes tenter{from{transform:translateY(100%)}to{transform:none}}
.ttouch{position:absolute;z-index:45;left:58%;top:74%;width:min(13vw,calc(var(--vh,1vh)*7),60px);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 0 0 7px rgba(255,255,255,.16),0 4px 18px rgba(0,0,0,.25);opacity:0;pointer-events:none;transform:translate(-50%,-50%)}
.ttouch.go{animation:ttg .62s cubic-bezier(.55,0,.2,1)}
@keyframes ttg{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}85%{opacity:.9;transform:translate(-50%,calc(-50% - calc(var(--vh,1vh)*46)))}100%{opacity:0;transform:translate(-50%,calc(-50% - calc(var(--vh,1vh)*50)))}}

/* CH 01 "clips": faixas de montagem a correr + marcas de entrada/saída a encaixar na palavra */
.lanes{position:absolute;inset:-10%;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--vh,1vh)*2.2);transform:rotate(-7deg)}
.lrow{display:flex;gap:8px;height:calc(var(--vh,1vh)*8.5);width:max-content;animation:lanes var(--sp) linear infinite}
.lrow.rev{animation-direction:reverse}
.lrow i{flex:none;height:100%;width:var(--w);border-radius:9px;background:rgba(255,255,255,.22)}
@keyframes lanes{to{transform:translateX(-50%)}}
.clipword{position:relative;display:inline-block;padding:0 .12em}
.clipword::before,.clipword::after{content:"";position:absolute;top:-.12em;bottom:-.08em;width:.22em;border:.08em solid var(--amber);opacity:0}
.clipword::before{left:-.32em;border-right:0}
.clipword::after{right:-.32em;border-left:0}
.fr.on .clipword::before{animation:brkl .28s cubic-bezier(.2,1.4,.4,1) .06s forwards}
.fr.on .clipword::after{animation:brkr .28s cubic-bezier(.2,1.4,.4,1) .06s forwards}
@keyframes brkl{from{opacity:0;transform:translateX(-.6em)}to{opacity:1;transform:none}}
@keyframes brkr{from{opacity:0;transform:translateX(.6em)}to{opacity:1;transform:none}}

.conf{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}

/* t5: pódio limpo, no mesmo fundo do resto do trailer */
.podium{position:relative;z-index:7;width:min(84vw,560px);height:min(calc(var(--vh,1vh)*46),480px)}
.pworld{position:absolute;inset:0;display:flex;align-items:flex-end;gap:clamp(6px,1.6vw,14px);transform-origin:50% 88%;will-change:transform}
.pcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pblk{width:100%;height:var(--ph);border-radius:12px 12px 0 0;display:flex;justify-content:center;padding-top:clamp(10px,calc(var(--vh,1vh)*2),20px);transform-origin:50% 100%;transform:scaleY(0)}
.pblk span{font-weight:900;font-size:clamp(30px,min(10vw,calc(var(--vh,1vh)*7)),84px);line-height:1;letter-spacing:-.04em;color:var(--ink);opacity:0}
.p1 .pblk{--ph:62%;background:var(--amber)}
.p2 .pblk{--ph:46%;background:var(--paper)}
.p3 .pblk{--ph:34%;background:var(--steel)}
.pav{width:clamp(40px,min(12vw,calc(var(--vh,1vh)*7)),80px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(243,240,232,.5);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:clamp(15px,min(4.4vw,calc(var(--vh,1vh)*2.6)),28px);color:var(--paper);margin-bottom:clamp(10px,calc(var(--vh,1vh)*1.8),16px);opacity:0;transform:scale(.4)}
.p1 .pav{width:clamp(48px,min(14vw,calc(var(--vh,1vh)*8.4)),96px);border-color:var(--amber);color:var(--amber)}
.pcrown{width:clamp(26px,min(7.6vw,calc(var(--vh,1vh)*4.6)),52px);height:auto;opacity:0;margin-bottom:6px;display:block}
.pcol.up .pblk{animation:pup .38s cubic-bezier(.2,1.25,.4,1) forwards}
.pcol.up .pblk span{animation:fadein .2s ease .2s forwards}
.pcol.up .pav{animation:pavp .3s cubic-bezier(.3,1.6,.5,1) .2s forwards}
.p1.up .pblk{animation-duration:.5s}
.p1.up .pcrown{animation:pcr .35s cubic-bezier(.3,1.6,.5,1) .45s forwards}
@keyframes pup{to{transform:none}}
@keyframes pavp{to{opacity:1;transform:none}}
@keyframes pcr{from{opacity:0;transform:translateY(-20px) scale(.5)}to{opacity:1;transform:none}}

/* ecrã de entrada e botão de som */
.gate{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--ink);color:var(--paper);cursor:pointer}
.gate::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.gate.gone{display:none}
.gate .gin{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,calc(var(--vh,1vh)*2),18px);padding:0 24px}
.gate h1{font-weight:900;font-size:clamp(32px,min(10vw,calc(var(--vh,1vh)*7)),84px);letter-spacing:-.04em;line-height:1}
.gate .play{margin-top:clamp(10px,calc(var(--vh,1vh)*2),20px);width:clamp(76px,min(22vw,calc(var(--vh,1vh)*12)),120px);aspect-ratio:1;border-radius:50%;border:0;background:var(--tally);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 0 rgba(255,74,46,.5);animation:gping 1.8s ease-out infinite}
.gate .play svg{width:38%;margin-left:8%;fill:#fff}
@keyframes gping{0%{box-shadow:0 0 0 0 rgba(255,74,46,.45)}100%{box-shadow:0 0 0 26px rgba(255,74,46,0)}}
.gate .snd{display:flex;align-items:center;gap:8px;opacity:.7}
.gate .snd svg{width:16px;fill:none;stroke:currentColor;stroke-width:2}
.sndbtn{position:absolute;z-index:60;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(243,240,232,.45);background:rgba(14,15,19,.6);color:var(--paper);display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sndbtn svg{width:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sndbtn .x{display:none}
.sndbtn.off .w{display:none}.sndbtn.off .x{display:inline}
.sndbtn:focus-visible,.gate .play:focus-visible{outline:3px solid var(--chroma);outline-offset:3px}
.sndbtn.wait{animation:gping 1.8s ease-out infinite;border-color:var(--tally)}

/* ecrã inicial: só o botão Sincronizar */
.gate{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:var(--ink)}
.gate::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.gate.gone{display:none}
.syncbtn{position:relative;z-index:2;font-family:var(--mono);font-weight:700;font-size:clamp(13px,min(3.8vw,calc(var(--vh,1vh)*2)),18px);letter-spacing:.14em;text-transform:uppercase;
  padding:1em 1.4em;border:0;background:transparent;color:var(--paper);cursor:pointer;opacity:.85;transition:opacity .2s}
.syncbtn:hover{opacity:1}
.syncbtn:focus-visible{outline:3px solid var(--chroma);outline-offset:4px}

.gate.leaving .syncbtn{animation:syncglitch .44s steps(1,end) forwards;pointer-events:none}
@keyframes syncglitch{
  0%{opacity:1;transform:none;text-shadow:none;clip-path:inset(0)}
  8%{transform:translate(-6px,0) skewX(-12deg);text-shadow:3px 0 rgba(255,74,46,.9),-3px 0 rgba(43,224,122,.9);clip-path:inset(10% 0 45% 0)}
  16%{opacity:.2;transform:translate(5px,1px)}
  24%{opacity:1;transform:translate(-2px,0) scaleX(1.15);text-shadow:-4px 0 rgba(255,74,46,.9),4px 0 rgba(90,169,255,.9);clip-path:inset(50% 0 5% 0)}
  34%{transform:translate(8px,-1px) skewX(10deg);clip-path:inset(0 0 60% 0)}
  44%{opacity:.6;transform:none;text-shadow:2px 0 rgba(255,74,46,.8),-2px 0 rgba(43,224,122,.8);clip-path:inset(30% 0 30% 0)}
  56%{opacity:0}
  64%{opacity:.9;transform:translate(-3px,0) scaleY(.4);clip-path:inset(45% 0 45% 0)}
  74%{opacity:.4;transform:scaleX(1.6) scaleY(.08)}
  86%,100%{opacity:0;transform:scaleX(2) scaleY(.02)}}
.ts#t1 .t1scan{background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}

<body>
<div class="app" id="app" role="region" aria-roledescription="carrossel" aria-label="Recap do mês">
  <div class="top"><div class="bars" id="bars"></div><div class="brand">farmerrr</div></div>
  <div id="slides"></div>
  <div class="flash" id="flash"></div>
  <canvas class="noise" id="noise"></canvas>
  <div class="scanbar" id="scanbar"></div>
  <div class="gate" id="gate"><button class="syncbtn" id="syncbtn">Sincronizar</button></div>
  <button class="sndbtn" id="sndbtn" aria-label="Desligar som"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg></button>
  <div class="trailer gone" id="trailer" role="img" aria-label="Trailer do Recap">
    <div id="tscenes"></div>
    <button class="tskip" id="tskip">Saltar intro</button>
    <div class="tprog"></div>
  </div>
</div>
<script>
/* ======= Som: trilha e efeitos 100% sintetizados (Web Audio), sem ficheiros ======= */
const Snd=(()=>{
  let rec=false, verb=null, ctx=null, master, comp, music, mfilt, sfx, noiseBuf, muted=false, group=[], loopOn=false, loopT=null, loopStep=0, loopNext=0;
  const BPM=120, STEP=60/BPM/4;                              // semicolcheia = 125 ms
  const CH=[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]]; // Lá m · Fá · Dó · Sol
  const BASS=[55,43.65,65.41,49];
  function init(){
    if(ctx) return ctx.resume().catch(()=>{});
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    comp=ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.knee.value=8; comp.ratio.value=12; comp.attack.value=.004; comp.release.value=.2;
    master=ctx.createGain(); master.gain.value=muted?0:.7; master.connect(comp); comp.connect(ctx.destination);
    music=ctx.createGain(); music.gain.value=.55; mfilt=ctx.createBiquadFilter(); mfilt.type='lowpass'; mfilt.frequency.value=18000; mfilt.Q.value=.7;
    music.connect(mfilt); mfilt.connect(master);
    sfx=ctx.createGain(); sfx.gain.value=.9; sfx.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    // reverberação gerada (sala grande, ~3,5 s) para dar cauda e profundidade
    const len=ctx.sampleRate*3.6, ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){ const ch=ir.getChannelData(c); for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
    verb=ctx.createConvolver(); verb.buffer=ir; const vg=ctx.createGain(); vg.gain.value=.55; verb.connect(vg); vg.connect(master);
    const ms=ctx.createGain(); ms.gain.value=.22; mfilt.connect(ms); ms.connect(verb);
    const ss=ctx.createGain(); ss.gain.value=.28; sfx.connect(ss); ss.connect(verb);
    return ctx.resume().catch(()=>{});
  }
  const now=()=>ctx?ctx.currentTime:0;
  const keep=n=>{ if(rec) group.push(n); return n; };
  function env(g,t,a,peak,d,sus=0,rel=.05){ g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(Math.max(.0001,sus||.0001),t+a+d); if(sus) g.gain.exponentialRampToValueAtTime(.0001,t+a+d+rel); }
  function osc(type,f,t,dur,peak,out,a=.005,d=null){ const o=keep(ctx.createOscillator()), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); env(g,t,a,peak,d??dur); o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+.1); return o; }
  function noise(t,dur,peak,out,ftype='highpass',ff=1000,q=.7,a=.002){ const s=keep(ctx.createBufferSource()), f=ctx.createBiquadFilter(), g=ctx.createGain(); s.buffer=noiseBuf; s.loop=true; f.type=ftype; f.frequency.setValueAtTime(ff,t); f.Q.value=q; env(g,t,a,peak,dur); s.connect(f); f.connect(g); g.connect(out); s.start(t,Math.random()); s.stop(t+dur+.1); return {s,f,g}; }
  /* instrumentos */
  const kick=(t,v=1,out=music)=>{ const o=keep(ctx.createOscillator()), g=ctx.createGain(); o.frequency.setValueAtTime(155,t); o.frequency.exponentialRampToValueAtTime(42,t+.12); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+.38); o.connect(g); g.connect(out); o.start(t); o.stop(t+.45); };
  const clap=(t,v=.5)=>{ [0,.011,.022].forEach(o=>noise(t+o,.09,v*.6,music,'bandpass',1500,1.2)); noise(t+.03,.2,v*.35,music,'bandpass',1200,.8); };
  const hat=(t,v=.18,open=false)=>noise(t,open?.22:.04,v,music,'highpass',7500,.6);
  const bass=(t,f,dur=.22,v=.45)=>{ const o=keep(ctx.createOscillator()), fl=ctx.createBiquadFilter(), g=ctx.createGain(); o.type='sawtooth'; o.frequency.value=f; fl.type='lowpass'; fl.frequency.setValueAtTime(900,t); fl.frequency.exponentialRampToValueAtTime(180,t+dur); env(g,t,.005,v,dur); o.connect(fl); fl.connect(g); g.connect(music); o.start(t); o.stop(t+dur+.1); };
  const pluck=(t,f,v=.12)=>{ osc('triangle',f*2,t,.18,v,music); osc('square',f*4,t,.08,v*.25,music); };
  const pad=(t,ch,dur=2,v=.07)=>{ ch.forEach(f=>[-6,6].forEach(dt=>{ const o=keep(ctx.createOscillator()), fl=ctx.createBiquadFilter(), g=ctx.createGain(); o.type='sawtooth'; o.frequency.value=f; o.detune.value=dt; fl.type='lowpass'; fl.frequency.value=1100; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.35); g.gain.setValueAtTime(v,t+dur-.3); g.gain.linearRampToValueAtTime(0,t+dur); o.connect(fl); fl.connect(g); g.connect(music); o.start(t); o.stop(t+dur+.05); })); };
  /* instrumentos de suspense */
  const toVerb=(node,amt)=>{ if(!verb) return; const g=ctx.createGain(); g.gain.value=amt; node.connect(g); g.connect(verb); };
  function braam(t,v=1,dur=2.6,root=55){ // golpe grave de "trailer de cinema"
    const out=ctx.createGain(); out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(.32*v,t+.03); out.gain.setTargetAtTime(.0001,t+.25,dur/4); out.connect(sfx); toVerb(out,.9);
    const fl=ctx.createBiquadFilter(); fl.type='lowpass'; fl.Q.value=4; fl.frequency.setValueAtTime(2400,t); fl.frequency.exponentialRampToValueAtTime(220,t+dur*.7); fl.connect(out);
    [1,1.4983,2,2.3784].forEach((m,i)=>[-9,9].forEach(dt=>{ const o=keep(ctx.createOscillator()); o.type='sawtooth'; o.frequency.value=root*m; o.detune.value=dt; o.connect(fl); o.start(t); o.stop(t+dur+.2); }));
    const sub=keep(ctx.createOscillator()), sg=ctx.createGain(); sub.frequency.value=root; sg.gain.setValueAtTime(.5*v,t); sg.gain.exponentialRampToValueAtTime(.0001,t+dur); sub.connect(sg); sg.connect(sfx); sub.start(t); sub.stop(t+dur+.1);
    kick(t,.9*v,sfx); noise(t,.5,.25*v,sfx,'lowpass',900,.6); }
  function heart(t,v=.8){ kick(t,v,music); kick(t+.19,v*.6,music); }
  function drone(t,dur,v=.12,root=55){ // tapete grave com respiração lenta
    const g=ctx.createGain(), fl=ctx.createBiquadFilter(), lfo=keep(ctx.createOscillator()), lg=ctx.createGain();
    fl.type='lowpass'; fl.frequency.value=380; lfo.frequency.value=.18; lg.gain.value=160; lfo.connect(lg); lg.connect(fl.frequency); lfo.start(t); lfo.stop(t+dur+.1);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+Math.min(1.5,dur/3)); g.gain.setValueAtTime(v,t+dur*.75); g.gain.linearRampToValueAtTime(0,t+dur);
    [root,root*2,root*1.5].forEach((f,i)=>{ const o=keep(ctx.createOscillator()); o.type=i?'triangle':'sawtooth'; o.frequency.value=f; o.detune.value=i*4; o.connect(fl); o.start(t); o.stop(t+dur+.1); });
    fl.connect(g); g.connect(music); }
  function strings(t,dur,notes,v=.05){ // cordas tensas em trémulo (intervalos dissonantes)
    const g=ctx.createGain(), fl=ctx.createBiquadFilter(), trem=keep(ctx.createOscillator()), tg=ctx.createGain(), am=ctx.createGain();
    fl.type='lowpass'; fl.frequency.value=2200; trem.frequency.value=7.5; tg.gain.value=.5; am.gain.value=.5; trem.connect(tg); tg.connect(am.gain); trem.start(t); trem.stop(t+dur+.1);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+dur*.6); g.gain.linearRampToValueAtTime(0,t+dur);
    notes.forEach(f=>[-7,7].forEach(dt=>{ const o=keep(ctx.createOscillator()); o.type='sawtooth'; o.frequency.value=f; o.detune.value=dt; o.connect(fl); o.start(t); o.stop(t+dur+.1); }));
    fl.connect(am); am.connect(g); g.connect(music); }
  function swell(t,dur,v=.35){ // som invertido que cresce e corta seco no golpe
    const n=noise(t,dur,v,sfx,'lowpass',300,.7,dur); n.f.frequency.exponentialRampToValueAtTime(9000,t+dur); n.g.gain.cancelScheduledValues(t); n.g.gain.setValueAtTime(.0001,t); n.g.gain.exponentialRampToValueAtTime(v,t+dur); n.g.gain.setValueAtTime(0,t+dur+.005); }
  /* efeitos */
  const E={
    whoosh(t=now(),dur=.45,v=.35,up=true){ const n=noise(t,dur,v,sfx,'bandpass',up?400:4000,1.4,dur*.6); n.f.frequency.exponentialRampToValueAtTime(up?5000:300,t+dur); },
    thud(t=now(),v=.9){ kick(t,v,sfx); noise(t,.18,.25*v,sfx,'lowpass',500,.7); },
    impact(t=now(),v=1){ kick(t,v*.75,sfx); const o=keep(ctx.createOscillator()), g=ctx.createGain(); o.frequency.setValueAtTime(70,t); o.frequency.exponentialRampToValueAtTime(30,t+1.2); g.gain.setValueAtTime(.42*v,t); g.gain.exponentialRampToValueAtTime(.0001,t+1.4); o.connect(g); g.connect(sfx); o.start(t); o.stop(t+1.5);
      const n=noise(t,1.1,.35*v,sfx,'lowpass',6000,.5); n.f.frequency.exponentialRampToValueAtTime(300,t+1.1); },
    click(t=now(),v=.25,f=2200){ osc('square',f,t,.018,v,sfx,.001); },
    blip(t=now(),f=880,v=.18){ osc('sine',f,t,.09,v,sfx,.002); },
    pop(t=now(),v=.4){ const o=keep(ctx.createOscillator()), g=ctx.createGain(); o.frequency.setValueAtTime(420,t); o.frequency.exponentialRampToValueAtTime(1300,t+.07); env(g,t,.002,v,.12); o.connect(g); g.connect(sfx); o.start(t); o.stop(t+.2); },
    sparkle(t=now(),v=.14){ [1568,2093,2637,3136].forEach((f,i)=>{ osc('sine',f,t+i*.045,.5,v,sfx,.003); osc('sine',f*2.01,t+i*.045,.25,v*.3,sfx,.003); }); },
    chime(t=now(),v=.22){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>{ osc('sine',f,t+i*.06,.9,v,sfx,.004); osc('triangle',f*2,t+i*.06,.4,v*.2,sfx,.004); }); },
    buzz(t=now(),v=.18){ osc('square',110,t,.22,v,sfx,.005); osc('square',116,t,.22,v*.7,sfx,.005); },
    riser(t,dur,v=.3){ const n=noise(t,dur,v,sfx,'bandpass',300,2,dur*.95); n.f.frequency.exponentialRampToValueAtTime(7000,t+dur);
      const o=keep(ctx.createOscillator()), g=ctx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(880,t+dur); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v*.25,t+dur*.95); g.gain.linearRampToValueAtTime(0,t+dur); const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=2500; o.connect(f); f.connect(g); g.connect(sfx); o.start(t); o.stop(t+dur+.05); },
    stat(t=now(),dur=1.2,v=.3){ const n=noise(t,dur,v,sfx,'highpass',600,.5,.06); n.g.gain.setValueAtTime(v,t+.06); n.g.gain.setValueAtTime(v,t+dur*.45); n.g.gain.linearRampToValueAtTime(.0001,t+dur); },
    tvon(t=now(),v=.5){ kick(t,v*.7,sfx); osc('sine',15200,t,.6,v*.05,sfx,.01); noise(t,.12,v*.3,sfx,'bandpass',3000,1); },
    tvoff(t=now(),v=.4){ const o=keep(ctx.createOscillator()), g=ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(1800,t); o.frequency.exponentialRampToValueAtTime(60,t+.3); env(g,t,.003,v,.32); o.connect(g); g.connect(sfx); o.start(t); o.stop(t+.4); noise(t,.08,v*.4,sfx,'highpass',2000); },
    rec(t=now(),v=.05){ osc('sine',1568,t,.07,v,sfx,.003); osc('sine',3136,t,.04,v*.25,sfx,.002); },
    tzz(t=now(),dur=.38,v=.3){ // "tzzz": zumbido elétrico com estalidos
      const n=noise(t,dur,v*.7,sfx,'bandpass',3200,1.1,.01); const b=keep(ctx.createOscillator()), bf=ctx.createBiquadFilter(), bg=ctx.createGain();
      b.type='square'; b.frequency.setValueAtTime(118,t); b.frequency.linearRampToValueAtTime(96,t+dur); bf.type='bandpass'; bf.frequency.value=900; bf.Q.value=.8;
      bg.gain.setValueAtTime(0,t); for(let k=0;k<Math.floor(dur/.03);k++) bg.gain.setValueAtTime(Math.random()<.75?v*.5:0,t+k*.03); bg.gain.setValueAtTime(0,t+dur);
      b.connect(bf); bf.connect(bg); bg.connect(sfx); b.start(t); b.stop(t+dur+.05);
      for(let k=0;k<6;k++) osc('square',800+Math.random()*3500,t+Math.random()*dur,.012,v*.4,sfx,.001); },
    tick(t=now(),v=.06){ osc('square',3200+Math.random()*600,t,.012,v,sfx,.001); }
  };
  /* trilha e efeitos do trailer, agendados no relógio de áudio (sincronismo ao milissegundo) */
  function trailer(offset=0){ // offset: ms já decorridos do trailer quando o som pôde arrancar
    if(!ctx) return; cancel(); stopLoop(); rec=true;
    const PRE=1000; offset-=PRE;   // 1 s de pré-arranque: a TV a ligar devagar antes das barras
    const t0=now()+.06-offset/1000, at=ms=>t0+ms/1000, on=(ms,fn)=>{ if(ms>=offset) fn(at(ms)); };
    // pré-arranque: estalido do relé, zumbido da rede e o apito agudo do tubo a aquecer
    on(-1000,t=>E.tzz(t,.3,.26)); on(-700,t=>E.click(t,.18,320));
    on(-680,t=>{ const h=keep(ctx.createOscillator()), hg=ctx.createGain(); h.frequency.value=50; h.type='triangle'; hg.gain.setValueAtTime(0,t); hg.gain.linearRampToValueAtTime(.05,t+.5); hg.gain.linearRampToValueAtTime(0,t+.75); h.connect(hg); hg.connect(sfx); h.start(t); h.stop(t+.8);

    [[700,830],[1010,1070],[1180,1260]].forEach(([a,b])=>on(a,t=>noise(t,(b-a)/1000,.22,sfx,'bandpass',2400,.8)));
    on(1500,t=>E.stat(t,.7,.28)); for(let ms=1500;ms<2200;ms+=55) if(Math.random()<.6) on(ms,t=>E.click(t,.12,600+Math.random()*3000));

    beats.forEach(ms=>on(ms,t=>heart(t,.75)));

        // 3,8 s · mudanças de canal
    [3800,4220,4640,5060].forEach(ms=>on(ms,t=>{ E.click(t,.3,1800); E.stat(t,.09,.22); }));

    for(let ms=5500;ms<7000;ms+=60) on(ms,t=>E.tick(t,.05));

    on(10100,t=>E.whoosh(t,.55,.3)); on(10050,t=>{ mfilt.frequency.setValueAtTime(18000,t); mfilt.frequency.exponentialRampToValueAtTime(650,t+.3); });
    on(11050,t=>E.whoosh(t,.5,.24));
    for(let i=0,ms=11880;ms<13600;i++){ on(ms,t=>E.tick(t,.045)); ms+=Math.max(28,140-i*6); }
    on(11950,t=>E.riser(t,1.95,.32)); on(11880,t=>{ mfilt.frequency.setValueAtTime(650,t); mfilt.frequency.exponentialRampToValueAtTime(16000,at(13850)); });
    for(let j=0;j<10;j++) on(12130+j*150,t=>E.pop(t,.07));

    on(14050,t=>swell(t,.7,.4));
    on(14750,t=>braam(t,1.15,4.5,55)); [14920,15090,15260,15430,15600].forEach(ms=>on(ms,t=>{ E.stat(t,.05,.12); kick(t,.45,sfx); }));

    on(15800,t=>E.tvoff(t,.25));
    // depois do "Prontos?" já não há trilha: fica só a cauda do último golpe a desvanecer
    rec=false;

  let loopTimer=null;
  function cancel(){ clearTimeout(loopTimer); const t=now(); group.forEach(n=>{ try{ n.stop(t); }catch(e){} }); group=[]; }
  /* ambiente de fundo do Recap: mais calmo, em ciclo */
  function startLoop(slow){ if(!ctx) return; stopLoop(); loopOn=true; loopStep=0; loopNext=now()+.08;
    music.gain.cancelScheduledValues(now()); music.gain.setValueAtTime(slow?.0001:music.gain.value,now()); music.gain.linearRampToValueAtTime(.3,now()+(slow?3.5:1.2));
    mfilt.frequency.cancelScheduledValues(now()); mfilt.frequency.setValueAtTime(2600,now());
    loopT=setInterval(()=>{ while(loopNext<now()+.15){ const st=loopStep%16, bar=Math.floor(loopStep/16)%4, t=loopNext;
        if(st===0) heart(t,.5); if(st%4===2) hat(t,.04);
        if(st===0){ pad(t,CH[bar],2,.05); bass(t,BASS[bar],1.6,.22); }
        if(st%4===0) pluck(t,CH[bar][(st>>2)%3]*2,.045);
        loopStep++; loopNext+=STEP; } },30); }
  function stopLoop(){ loopOn=false; clearInterval(loopT); }
  return {
    init, E, trailer, startLoop,
    skip(){ if(!ctx) return; cancel(); stopLoop(); music.gain.cancelScheduledValues(now()); music.gain.setTargetAtTime(.0001,now(),.05); E.tvoff(); },
    transition(tx){ if(!ctx) return; if(tx==='tv') E.tvon(); else if(tx==='static') E.stat(now(),1.3,.26); else E.whoosh(now(),.7,.28,false); },
    get muted(){ return muted; },
    toggle(){ muted=!muted; if(ctx){ master.gain.cancelScheduledValues(now()); master.gain.setTargetAtTime(muted?0:.7,now(),.05); } return muted; },
    ready:()=>!!ctx,
    running:()=>!!ctx&&ctx.state==='running',
    create(){ if(!ctx) init(); }
  };
})();

const noiseEl=document.getElementById('noise'), scanEl=document.getElementById('scanbar');
/* interferência analógica: grão fino, linhas de varrimento discretas e uma banda suave a rolar.
   A imagem antiga dissolve-se no chuvisco e a nova emerge devagar quando o sinal "agarra". */
const nctx=noiseEl.getContext('2d',{alpha:false}); let nRaf=null;
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function staticNoise(ms=1300){
  cancelAnimationFrame(nRaf);
  const w=noiseEl.width=Math.min(380,Math.ceil(innerWidth/1.8)), h=noiseEl.height=Math.ceil(w*innerHeight/innerWidth);
  const im=nctx.createImageData(w,h), px=new Uint32Array(im.data.buffer), t0=performance.now(), rowGain=new Float32Array(h);
  const frame=now=>{
    const t=Math.min(1,(now-t0)/ms);
    const op= t<.14 ? ease(t/.14) : t<.5 ? 1 : Math.max(0,(1-ease((t-.5)/.5))*(.97+Math.random()*.03));
    noiseEl.style.opacity=op.toFixed(3);
    const holdY=(t*1.1%1)*h*1.4-h*.2;
    for(let y=0;y<h;y++){
      if(Math.random()<.025) rowGain[y]=Math.random()*36-14; else rowGain[y]*=.55;
      const dist=Math.abs(y-holdY), hold=dist<h*.09?-42*Math.cos(dist/(h*.09)*Math.PI/2):0;
      const scan=(y%3===2)?.82:1, base=rowGain[y]+hold, o=y*w;
      for(let x=0;x<w;x++){
        const g=(Math.random()+Math.random())*124;
        let v=(g+base)*scan; v=v<0?0:v>255?255:v|0;
        const b=Math.min(255,v+4);
        px[o+x]=(255<<24)|(b<<16)|(v<<8)|v;
      }
    }
    nctx.putImageData(im,0,0);
    if(t<1) nRaf=requestAnimationFrame(frame); else noiseEl.style.opacity='0';
  };
  nRaf=requestAnimationFrame(frame);
}
const kick=el=>{ if(el===noiseEl){ staticNoise(); return; } el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); };

function countUp(el){
  const target=+el.dataset.count, k=el.dataset.fmt, delay=(+el.dataset.delay+1)*1000, dur=1100;
  el.textContent=fmt(0,k); const t0=performance.now()+delay;
  const step=now=>{ const p=Math.min(1,Math.max(0,(now-t0)/dur)), e=1-Math.pow(1-p,3);
    el.textContent=fmt(target*e,k); if(p>0&&p<1&&Snd.ready()&&now-(el._tk||0)>75){ el._tk=now; Snd.E.tick(undefined,.025); } if(p<1) raf.push(requestAnimationFrame(step)); };
  raf.push(requestAnimationFrame(step));
}
function runCounts(sl){ raf.forEach(cancelAnimationFrame); raf=[];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  sl.querySelectorAll('[data-count]').forEach(el=>reduce?el.textContent=fmt(+el.dataset.count,el.dataset.fmt):countUp(el)); }

function show(i,force,silent){
  const now=Date.now(); if(!force&&now<lockUntil) return; lockUntil=now+650;
  const prev=slides[cur], next=slides[i];
  clearTimeout(leaveT); slides.forEach(s=>s.classList.remove('leaving'));
  // 1.º→2.º: interferência · 2.º→3.º: TV a ligar · resto: aleatório entre TV e varrimento
  const tx=(i===1&&cur===0)?'static':(i===2&&cur===1)?'tv':(Math.random()<.5?'tv':'wipe');
  if(tx==='static') lockUntil=now+1300;
  slides.forEach(s=>s.classList.remove(...TXN.map(t=>'tx-'+t),...TXN.map(t=>'lv-'+t)));
  if(prev&&prev!==next){ prev.classList.remove('on'); prev.classList.add('leaving','lv-'+tx); leaveT=setTimeout(()=>prev.classList.remove('leaving',...TXN.map(t=>'lv-'+t)),820); }
  next.classList.remove('on'); void next.offsetWidth; next.classList.add('on','tx-'+tx);
  if(tx==='tv') kick(flash); if(tx==='static') kick(noiseEl); if(tx==='wipe') kick(scanEl);
  if(!silent) Snd.transition(tx);
  if(next.querySelector('#chatlist')) chatStart(); else chatStop();
  slides.forEach(sl=>sl.querySelectorAll('canvas.conf').forEach(stopConfetti));
  { const c=next.querySelector('canvas.conf'); if(c) setTimeout(()=>confetti(c,'rain'),700); }

  app.classList.toggle('lightui',lightT.some(t=>next.classList.contains(t)));
  if(next.querySelector('#quiz')) resetQuiz();
  runCounts(next); cur=i;
}

const CONF_COL=['#F3F0E8','#FFB31A','#2BE07A','#5AA9FF','#0E0F13','#FF8FC8'];
const confRuns=new Map();
function confetti(cv,mode='burst',dur=2600){
  stopConfetti(cv);
  const dpr=Math.min(2,devicePixelRatio||1), W=cv.clientWidth||innerWidth, H=cv.clientHeight||innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const u=Math.min(W,H)/400, ps=[], t0=performance.now();
  const make=(x,y,burst)=>{ const a=burst?R(-Math.PI*.97,-Math.PI*.03):R(Math.PI*.4,Math.PI*.6), sp=burst?R(7,15)*u:R(1.5,3.5)*u;
    return {x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:R(7,12)*u,h:R(12,20)*u,r:R(0,6.28),vr:R(-.25,.25),t:R(0,6.28),vt:R(.08,.22),c:pick(CONF_COL),sq:Math.random()<.25,sw:R(.5,1.6)}; };
  if(mode==='burst'){ for(let i=0;i<160;i++) ps.push(make(W/2+R(-30,30)*u,H*.55+R(-10,10)*u,true)); }
  else if(mode==='fall'){ for(let i=0;i<110;i++){ const q=make(R(0,W),R(-H*.3,H),false); q.vy=R(3,7)*u; ps.push(q); } }
  else { for(let i=0;i<90;i++) ps.push(make(W/2+R(-60,60)*u,H*.62,true)); }
  let last=t0;
  const frame=now=>{
    const dt=Math.min(2.2,(now-last)/16.67); last=now; const el=now-t0;
    if(mode==='rain'&&ps.length<140&&Math.random()<.6) ps.push(make(R(0,W),-20,false));
    if(mode==='fall'&&ps.length<130){ const q=make(R(0,W),-20,false); q.vy=R(3,6)*u; ps.push(q); }
    ctx.clearRect(0,0,W,H);
    for(let i=ps.length-1;i>=0;i--){ const p=ps[i];
      p.vx*=Math.pow(.97,dt); p.vy=p.vy*Math.pow(.985,dt)+.55*u*dt; if(p.vy>8.5*u) p.vy=8.5*u;   // resistência do ar + velocidade terminal
      p.t+=p.vt*dt; p.x+=(p.vx+Math.sin(p.t)*p.sw*u*.8)*dt; p.y+=p.vy*dt; p.r+=p.vr*dt;
      if(p.y>H+30){ ps.splice(i,1); continue; }
      const fl=Math.cos(p.t*1.6);                                   // virar no ar (efeito 3D)
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.scale(1,fl);
      ctx.fillStyle=p.c; ctx.globalAlpha=.75+.25*Math.abs(fl);
      if(p.sq) ctx.fillRect(-p.w/2,-p.w/2,p.w,p.w); else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*.55);
      ctx.restore(); }
    if((mode==='rain'||mode==='fall'||el<dur)&&cv.isConnected&&cv.offsetParent!==null) confRuns.set(cv,requestAnimationFrame(frame)); else confRuns.delete(cv);
  };
  confRuns.set(cv,requestAnimationFrame(frame));
}
function stopConfetti(cv){ if(confRuns.has(cv)){ cancelAnimationFrame(confRuns.get(cv)); confRuns.delete(cv); } }

  touch.className='touch'; touch.style.animationDuration='';

    touch.classList.remove('swipe'); void touch.offsetWidth; touch.classList.add('swipe'); feed.style.transform=`translateY(-${(k+3)*100}%)`; }));

  const cam=document.getElementById('cam');
  const camTo=(rs,vs,dur,easing)=>{
    const wide=matchMedia('(min-width:600px) and (min-aspect-ratio:5/4)').matches;
    rail.style.transition=ph.style.transition=cam.style.transition=`transform ${dur}s ${easing}, border-radius ${dur}s ${easing}`;
    rail.style.transformOrigin=`${hx}px ${hy}px`; ph.style.transformOrigin=`${sx}px ${sy}px`;

      const C=Math.max(innerWidth/W,innerHeight/H)*1.04, f=(rs-1)/1.2;
